<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Layout Sections Fixture</title>
  <style>
    body { font-family: sans-serif; margin: 0; background: #0f172a; color: #fff; }
    nav { display: flex; justify-content: space-between; padding: 20px 40px; }
    .hero { display: flex; flex-direction: column; align-items: center; padding: 80px 40px; gap: 24px; }
    .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 32px; padding: 40px; }
    .pricing { display: flex; justify-content: center; gap: 24px; padding: 60px 40px; }
    footer { display: flex; justify-content: space-between; padding: 40px; border-top: 1px solid #334155; }
  </style>
</head>
<body>
  <nav><div class="logo">Specimen</div><div class="links">Home</div></nav>
  <section class="hero"><h1>Headline</h1><p>Subheading</p></section>
  <section class="grid"><div>Feature 1</div><div>Feature 2</div><div>Feature 3</div></section>
  <section class="pricing"><div>Tier 1</div><div>Tier 2</div></section>
  <footer><div>&copy; 2026 Specimen</div></footer>
</body>
</html>
