<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>WAAPI Animations Fixture</title>
  <style>
    .spinner {
      width: 48px;
      height: 48px;
      border: 4px solid #e2e8f0;
      border-top-color: #3b82f6;
      border-radius: 50%;
    }
    .slider {
      width: 200px;
      height: 20px;
      background: #10b981;
    }
  </style>
</head>
<body>
  <div class="spinner"></div>
  <div class="slider"></div>

  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const spinner = document.querySelector('.spinner');
      if (spinner && spinner.animate) {
        spinner.animate(
          [
            { transform: 'rotate(0deg)' },
            { transform: 'rotate(360deg)' }
          ],
          {
            duration: 1000,
            iterations: Infinity,
            easing: 'linear'
          }
        );
      }

      const slider = document.querySelector('.slider');
      if (slider && slider.animate) {
        slider.animate(
          [
            { opacity: 0.2, transform: 'translateX(0px)' },
            { opacity: 1.0, transform: 'translateX(100px)' }
          ],
          {
            duration: 800,
            delay: 100,
            iterations: 1,
            easing: 'ease-out',
            fill: 'forwards'
          }
        );
      }
    });
  </script>
</body>
</html>
