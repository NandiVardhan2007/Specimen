<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Basic Tokens Fixture</title>
  <style>
    :root {
      --bg: #0b0d12;
      --accent: #7c5cff;
      --text: #f0f2f5;
      --surface: #171a21;
      --border: #262a36;
      --radius-sm: 4px;
      --radius-md: 8px;
      --radius-lg: 16px;
      --space-1: 8px;
      --space-2: 16px;
      --space-3: 24px;
      --space-4: 32px;
    }
    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      margin: 0;
      padding: var(--space-4);
    }
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      padding: var(--space-3);
      margin-bottom: var(--space-2);
    }
    .btn {
      background: var(--accent);
      color: #ffffff;
      border-radius: var(--radius-sm);
      padding: var(--space-1) var(--space-2);
      border: none;
      cursor: pointer;
    }
    @media (min-width: 640px) {
      .container { max-width: 640px; }
    }
    @media (min-width: 1024px) {
      .container { max-width: 1024px; }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="card">
      <h1>Design System Baseline</h1>
      <p>Specimen extraction ground truth fixture for basic tokens.</p>
      <button class="btn">Action</button>
    </div>
  </div>
</body>
</html>
