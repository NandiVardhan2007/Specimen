<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Typography Scale Fixture</title>
  <style>
    body {
      font-family: "Inter", system-ui, sans-serif;
      margin: 40px;
      color: #111827;
      background: #ffffff;
    }
    h1 { font-size: 48px; line-height: 1.1; font-weight: 800; letter-spacing: -0.02em; }
    h2 { font-size: 36px; line-height: 1.2; font-weight: 700; letter-spacing: -0.01em; }
    h3 { font-size: 28px; line-height: 1.3; font-weight: 600; }
    h4 { font-size: 20px; line-height: 1.4; font-weight: 600; }
    p.body { font-size: 16px; line-height: 1.5; font-weight: 400; }
    p.caption { font-size: 12px; line-height: 1.4; font-weight: 400; color: #6b7280; }
  </style>
</head>
<body>
  <h1>Heading 1 - Display Title</h1>
  <h2>Heading 2 - Section Header</h2>
  <h3>Heading 3 - Subsection</h3>
  <h4>Heading 4 - Component Header</h4>
  <p class="body">Body paragraph text representing typical reading content.</p>
  <p class="caption">Small text caption or disclaimer.</p>
</body>
</html>
