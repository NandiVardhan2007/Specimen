[package]
name = "specimen-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[[bin]]
name = "specimen"
path = "src/main.rs"

[dependencies]
specimen-core = { path = "../specimen-core" }
specimen-capture = { path = "../specimen-capture" }
specimen-library = { path = "../specimen-library" }
specimen-agent = { path = "../specimen-agent" }
clap = { version = "4.5", features = ["derive"] }
