[package]
name = "specimen-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[[bin]]
name = "specimen"
path = "src/main.rs"

[dependencies]
specimen-core = { path = "../specimen-core" }
specimen-capture = { path = "../specimen-capture" }
specimen-extract = { path = "../specimen-extract" }
specimen-library = { path = "../specimen-library" }
specimen-agent = { path = "../specimen-agent" }
specimen-export = { path = "../specimen-export" }
specimen-server = { path = "../specimen-server" }
specimen-mcp = { path = "../specimen-mcp" }
clap = { version = "4.5", features = ["derive"] }
tokio = { version = "1.43", features = ["rt-multi-thread", "macros"] }
url = "2.5"
tempfile = "3.17"
serde.workspace = true
serde_json.workspace = true
serde_yaml.workspace = true
